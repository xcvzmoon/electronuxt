name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run oxlint
        run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Check formatting
        run: pnpm exec oxfmt --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run typecheck
        run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build
        run: pnpm run build

  build-electron:
    name: Build Electron
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build Nuxt server
        run: pnpm run build

      - name: Build Electron main/preload
        run: pnpm run build:electron

  ci:
    name: CI
    if: always()
    needs: [lint, format, typecheck, build, build-electron]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or reuse draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v tag="$TAG" '
            $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="See CHANGELOG.md for release notes."
          fi

          release_id=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)

          if [ -z "$release_id" ]; then
            release_id=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f body="$notes" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  release:
    name: Package (${{ matrix.os }})
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build Nuxt server
        run: pnpm run build

      - name: Build Electron main/preload
        run: pnpm run build:electron

      - name: Package and publish
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
